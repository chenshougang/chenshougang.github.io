<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="文章详情 - 陈守刚的技术博客">
    <meta name="theme-color" content="#05070d">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1320'/%3E%3Cpath d='M24 20 14 32l10 12M40 20l10 12-10 12' stroke='%2322d3ee' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>文章详情 | CSG.DEV</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>

<body>
    <div class="bg-layer" aria-hidden="true">
        <canvas id="bg-canvas"></canvas>
        <div class="bg-grid"></div>
        <div class="bg-vignette"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-content">
                <a href="../index.html" class="site-title">
                    <span class="logo-mark">&lt;/&gt;</span>
                    <span class="logo-text">CSG<span class="dim">.DEV</span></span>
                </a>
                <nav>
                    <ul>
                        <li><a href="../index.html">首页</a></li>
                        <li><a href="articles.html">文章</a></li>
                        <li><a href="about.html">关于</a></li>
                    </ul>
                </nav>
                <button id="theme-toggle" type="button" aria-label="切换明暗主题">
                    <i class="fas fa-sun sun-icon"></i>
                    <i class="fas fa-moon moon-icon"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="article-layout">
                <aside class="article-sidebar" id="toc-container" style="display: none;">
                    <!-- 目录由 JavaScript 动态生成 -->
                </aside>

                <article class="article-container">
                    <header class="article-header">
                        <h1 class="article-title" id="article-title">加载中...</h1>
                        <div class="article-meta">
                            <span class="article-date">
                                <i class="fas fa-calendar-alt"></i>
                                <span id="article-date-text">发布日期</span>
                            </span>
                            <span class="article-readtime">
                                <i class="fas fa-clock"></i>
                                <span id="article-readtime-text">-- 分钟</span>
                            </span>
                            <div class="article-tags" id="article-tags"></div>
                        </div>
                    </header>

                    <div class="article-content" id="article-content">
                        <!-- 文章内容由 JavaScript 动态渲染 -->
                    </div>

                    <div class="article-footer-actions">
                        <a href="articles.html" class="btn btn-ghost">
                            <i class="fas fa-arrow-left"></i> 返回文章列表
                        </a>
                        <a href="../index.html" class="btn btn-ghost">
                            <i class="fas fa-house"></i> 回到首页
                        </a>
                    </div>
                </article>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <div class="footer-links">
                    <a href="https://github.com/chenshougang" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="mailto:chenshougang1995@163.com" aria-label="邮箱">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="about.html" aria-label="关于我">
                        <i class="fas fa-user-astronaut"></i>
                    </a>
                </div>
                <p>&copy; <span id="current-year"></span> CSG.DEV · 陈守刚</p>
                <div class="footer-meta">
                    <span><span class="status-dot"></span> SYSTEM ONLINE</span>
                    <span>HTML / CSS / JAVASCRIPT</span>
                    <span>GITHUB PAGES</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/highlight.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/posts.js"></script>
    <script src="../js/effects.js"></script>
    <script src="../js/article.js"></script>
</body>

</html>
